<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduBot AI Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <main class="container">
      <header class="hero">
        <p class="eyebrow">AI Productivity and AI API</p>
        <h1>Bot Edukasi</h1>
        <p class="subtitle">
          Teman belajar santai kamu buat ngerjain tugas, paham konsep, dan
          belajar lebih cepat.
        </p>
      </header>

      <div id="chat-box" class="chat-box" aria-live="polite"></div>

      <section class="quick-prompts" aria-label="Contoh pertanyaan">
        <button
          type="button"
          class="prompt-btn"
          data-prompt="Jelasin fotosintesis pakai bahasa anak SMP."
        >
          Fotosintesis
        </button>
        <button
          type="button"
          class="prompt-btn"
          data-prompt="Bantu bikin jadwal belajar 7 hari buat persiapan ujian matematika."
        >
          Jadwal belajar
        </button>
        <button
          type="button"
          class="prompt-btn"
          data-prompt="Kasih aku 3 latihan soal persamaan linear + pembahasannya."
        >
          Latihan soal
        </button>
      </section>

      <form id="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Tanya apa aja seputar belajar..."
          autocomplete="off"
          required
        />
        <button type="submit">Kirim</button>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
